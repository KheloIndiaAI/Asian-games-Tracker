# Splits the two systemd units' journal entries into their own flat files
# so the CloudWatch agent (which tails files, not the journal directly) can
# ship them. Amazon Linux 2023's rsyslog reads the journal via imjournal by
# default, so no journald.conf changes are needed — just filter by
# programname, which is systemd's SyslogIdentifier= (set in both
# infra/systemd/*.service units).
:programname, isequal, "cheer4bharat-web" /var/log/cheer4bharat-web.log
& stop
:programname, isequal, "cheer4bharat-worker" /var/log/cheer4bharat-worker.log
& stop
