name: Deploy to AWS

# Builds the app and ships it to the EC2 instance via S3 + SSM Run Command.
# Uses GitHub's OIDC provider to assume an AWS IAM role — no long-lived AWS
# keys stored in GitHub. See docs/AWS_MIGRATION.md §3/§7 and
# infra/terraform/iam.tf for the role this workflow assumes.
#
# Required repo variables/secrets (Settings → Secrets and variables → Actions):
#   vars.AWS_REGION            e.g. ap-south-1
#   vars.AWS_DEPLOY_ROLE_ARN   output of terraform apply (github_actions_deploy_role)
#   vars.S3_ARTIFACT_BUCKET    output of terraform apply (artifacts_bucket)
#   vars.EC2_INSTANCE_ID       output of terraform apply (web_instance_id)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Build
        run: npm run build

      - name: Package release artifact
        run: |
          tar -czf release.tar.gz \
            .output \
            src/worker \
            src/server \
            src/lib \
            drizzle \
            infra \
            package.json \
            package-lock.json \
            drizzle.config.ts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact to S3
        id: upload
        run: |
          KEY="releases/${{ github.sha }}.tar.gz"
          aws s3 cp release.tar.gz "s3://${{ vars.S3_ARTIFACT_BUCKET }}/$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "commands=[\"sudo /opt/cheer4bharat/bin/deploy.sh '${{ vars.S3_ARTIFACT_BUCKET }}' '${{ steps.upload.outputs.key }}'\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll until the command finishes; fail the job if it didn't succeed.
          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for deploy"
          exit 1
